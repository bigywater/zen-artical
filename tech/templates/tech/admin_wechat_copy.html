<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>复制到公众号 · {{ article.title }}</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#F2EFE9; margin:0; padding:24px;}
  .toolbar{max-width:780px; margin:0 auto 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; background:#F2EFE9; padding:8px 0; z-index:10;}
  .toolbar h1{font-size:16px; margin:0; flex:1; color:#211C16;}
  button{font-size:14px; font-weight:600; padding:10px 18px; border-radius:8px; border:none; cursor:pointer; background:#E76F00; color:#fff;}
  button:active{transform:scale(.98);}
  .status{font-size:13px; color:#2C6E49; min-width:80px;}
  .preview-shell{max-width:780px; margin:0 auto; background:#fff; border:1px solid #E9E0D3; border-radius:12px; padding:28px 32px; box-shadow:0 1px 2px rgba(35,25,10,.06);}
  .hint{max-width:780px; margin:16px auto 0; font-size:13px; color:#8A7E6D; line-height:1.7;}
</style>
</head>
<body>
  <div class="toolbar">
    <h1>{{ article.title }}</h1>
    <span class="status" id="status"></span>
    <button id="copyBtn">复制到剪贴板</button>
  </div>
  <div class="preview-shell" id="wechat-content">{{ wechat_html|safe }}</div>
  <p class="hint">复制后直接粘贴进公众号图文编辑器正文区域即可,样式是内联的,不依赖外部CSS。链接会降级成普通加粗文字,图片(如果文章里有的话)需要单独上传到公众号素材库后手动替换。</p>

<script>
document.getElementById('copyBtn').addEventListener('click', async () => {
  const status = document.getElementById('status');
  const container = document.getElementById('wechat-content');
  const htmlStr = container.innerHTML;
  const textStr = container.innerText;
  try {
    const item = new ClipboardItem({
      'text/html': new Blob([htmlStr], {type: 'text/html'}),
      'text/plain': new Blob([textStr], {type: 'text/plain'}),
    });
    await navigator.clipboard.write([item]);
    status.textContent = '已复制 ✓';
  } catch (err) {
    status.textContent = '复制失败,请手动选中';
    console.error(err);
  }
  setTimeout(() => { status.textContent = ''; }, 2500);
});
</script>
</body>
</html>
