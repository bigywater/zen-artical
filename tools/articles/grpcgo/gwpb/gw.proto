syntax = "proto3";
package gw;
option go_package = "grpcgo/gwpb";
import "google/api/annotations.proto";

service Gw {
  rpc Echo(Item) returns (Item) {
    option (google.api.http) = { post: "/v1/echo" body: "*" };
  }
  rpc GetItem(GetReq) returns (Item) {
    option (google.api.http) = { get: "/v1/items/{id}" };
  }
  rpc Fail(FailReq) returns (Item) {
    option (google.api.http) = { get: "/v1/fail/{code}" };
  }
  rpc Slow(SlowReq) returns (Item) {
    option (google.api.http) = { get: "/v1/slow" };
  }
  rpc Count(CountReq) returns (stream Item) {
    option (google.api.http) = { get: "/v1/count" };
  }
  rpc Meta(GetReq) returns (Item) {
    option (google.api.http) = { get: "/v1/meta" };
  }
}
message Item {
  string id = 1;
  string name = 2;
  int64 count = 3;
  bytes payload = 4;
  repeated string tags = 5;
}
message GetReq { string id = 1; string name = 2; }
message FailReq { int32 code = 1; }
message SlowReq { int32 ms = 1; }
message CountReq { int32 n = 1; }
