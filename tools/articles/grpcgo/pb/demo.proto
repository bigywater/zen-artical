syntax = "proto3";
package demo;
option go_package = "grpcgo/pb";
service Demo {
  rpc Unary(Req) returns (Resp);
  rpc ServerStream(Req) returns (stream Resp);
  rpc ClientStream(stream Req) returns (Resp);
  rpc Bidi(stream Req) returns (stream Resp);
}
message Req { string msg = 1; int32 n = 2; bytes payload = 3; }
message Resp { string msg = 1; int32 n = 2; bytes payload = 3; }
